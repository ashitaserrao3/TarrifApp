[theme]
# The app mirrors the Excel workbook, so it keeps the workbook's light look.
base = "light"
primaryColor = "#1F4E78"

[server]
# Rate lists are a few MB each; leave room for the schedule workbook too.
maxUploadSize = 100

[client]
# Visitors only see the app, not Streamlit's developer menu or "Deploy" button.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
