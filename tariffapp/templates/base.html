<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cargo Tariffs{% endblock %} · Cargo Tariffs</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈</text></svg>">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="{{ url_for('main.dashboard') }}">✈ Cargo Tariffs</a>
    <nav>
      {% set ep = request.endpoint %}
      <a href="{{ url_for('main.dashboard') }}" class="{{ 'active' if ep == 'main.dashboard' }}">Route lookup</a>
      <a href="{{ url_for('main.flights') }}" class="{{ 'active' if ep == 'main.flights' }}">All flights</a>
      <a href="{{ url_for('main.history') }}" class="{{ 'active' if ep == 'main.history' }}">Rate history</a>
      <a href="{{ url_for('main.tariffs') }}" class="{{ 'active' if ep == 'main.tariffs' }}">Tariffs</a>
      <a href="{{ url_for('main.notes') }}" class="{{ 'active' if ep == 'main.notes' }}">Notes</a>
      <a href="{{ url_for('main.exceptions') }}" class="{{ 'active' if ep == 'main.exceptions' }}">Exceptions</a>
      <a href="{{ url_for('main.uploads') }}" class="{{ 'active' if ep == 'main.uploads' }}">Upload</a>
      <a href="{{ url_for('main.settings') }}" class="{{ 'active' if ep == 'main.settings' }}">Settings</a>
    </nav>
  </div>
</header>
<main class="wrap">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
